[package]
name = "privacy-cam"
version = "0.1.0"
edition = "2021"
rust-version = "1.75" # Mínimo recomendado para las dependencias

[dependencies]
# --- CLI y Utilidades Base ---
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"

# --- Concurrencia y Estado ---
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- Serialización (Config y Perfiles) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# --- Procesamiento de Imagen y Matemáticas ---
image = "0.25"
fast_image_resize = "5.1"
nalgebra = "0.35"

# --- Interfaz Gráfica (GUI) ---
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"

# --- Captura y Salida de Video ---
nokhwa = { version = "0.10.11", features = ["input-native"] }
virtualcam = "1.0.0"

# --- Inferencia de IA (ONNX Runtime) ---
ort = { version = "=2.0.0-rc.14", features = ["load-dynamic"] }

# --- Manejo de Errores ---
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Optimiza las dependencias (image, ort, etc.) incluso en builds debug
[profile.dev.package."*"]
opt-level = 3

[features]
default = []
